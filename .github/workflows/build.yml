name: HP20 Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Host regression tests
        run: |
          g++ -std=c++11 -Wall -Wextra \
            tests/model_test.cpp \
            hp20_thermal.cpp hp20_trend.cpp hp20_indicator.cpp \
            -o /tmp/hp20-tests
          /tmp/hp20-tests

      - uses: arduino/setup-arduino-cli@v2

      - name: Install pinned Arduino dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install 'DHT sensor library@1.4.7' 'Adafruit Unified Sensor@1.1.15' 'U8g2@2.36.19' 'ArduinoJson@7.4.3'

      - name: Compile SH1106 and SSD1306 variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/HP20 /tmp/hp20-sh1106 /tmp/hp20-ssd1306 /tmp/hp20-artifacts
          cp *.ino *.h *.cpp /tmp/HP20/

          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --build-property compiler.cpp.extra_flags=-DOLED_SH1106=1 \
            --output-dir /tmp/hp20-sh1106 /tmp/HP20

          arduino-cli compile --fqbn esp32:esp32:esp32 \
            --build-property compiler.cpp.extra_flags=-DOLED_SH1106=0 \
            --output-dir /tmp/hp20-ssd1306 /tmp/HP20

          VERSION=$(grep 'constexpr const char\* STRING' hp20_version.h | sed -E 's/.*"([^"]+)".*/\1/')
          cp /tmp/hp20-sh1106/HP20.ino.bin "/tmp/hp20-artifacts/HP20-v${VERSION}-SH1106.bin"
          cp /tmp/hp20-ssd1306/HP20.ino.bin "/tmp/hp20-artifacts/HP20-v${VERSION}-SSD1306.bin"
          sha256sum /tmp/hp20-artifacts/*.bin > /tmp/hp20-artifacts/SHA256SUMS.txt

      - name: Upload OTA-ready firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: HP20-firmware-${{ github.sha }}
          path: /tmp/hp20-artifacts/
          retention-days: 14
